
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Reading Quest</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #e8f1fb; }
        .app-card { max-width: 900px; margin: 32px auto; }
        .app-card > .card:not(.hero) {
            min-height: calc(100vh - 64px);
            overflow: hidden;
            border: 2px solid #a9bfdc;
            border-radius: 30px;
            background: #ffffff;
            box-shadow: 0 16px 38px rgba(69, 96, 132, 0.18) !important;
        }
        .setup-panel {
            margin-top: 38px;
            padding: 46px;
            border: 1px solid #d9e4f2;
            border-radius: 24px;
            background: #f8fbff;
            text-align: center;
        }
        .setup-label {
            color: #0d6efd;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }
        .setup-group {
            max-width: 680px;
            margin: 0 auto 30px;
            text-align: left;
        }
        .option-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .option-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 58px;
            padding: 14px 18px;
            border: 2px solid #d9e4f2;
            border-radius: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: border-color 150ms ease, background-color 150ms ease;
        }
        .option-card:hover { border-color: #8fb2e0; }
        .option-card:has(input:checked) {
            border-color: #0d6efd;
            background: #edf5ff;
        }
        .option-card input { margin: 0; accent-color: #0d6efd; }
        .setup-start { min-width: 280px; padding: 13px 30px; font-size: 1.05rem; }
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232, 241, 251, 0.48);
            backdrop-filter: blur(10px);
        }
        .loading-box {
            min-width: 300px;
            padding: 32px 42px;
            border: 1px solid rgba(169, 191, 220, 0.85);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 14px 34px rgba(69, 96, 132, 0.16);
            text-align: center;
        }
        .loading-spinner {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            border: 5px solid #dce9f8;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: loading-spin 800ms linear infinite;
        }
        .loading-title { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; }
        @keyframes loading-spin { to { transform: rotate(360deg); } }
        .passage { white-space: pre-wrap; line-height: 1.8; }
        .choice { display: block; padding: 9px 12px; margin: 7px 0; border: 1px solid #d9dee5; border-radius: 6px; }
        .choice:hover { background: #f8f9fa; }
        .explanation {
            background: #f5f9ff;
            border: 1px solid #d5e3f4;
            border-left: 4px solid #5b8fd6;
            box-shadow: 0 6px 18px rgba(69, 96, 132, 0.07);
        }
        .timer { font-size: 1.5rem; font-weight: bold; }
        .game-over { background: #f8d7da; border-left: 4px solid #dc3545; }
        .clickable-sentence {
            display: inline;
            padding: 2px 3px;
            margin: 0 1px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: inherit;
            text-align: left;
        }
        .clickable-sentence:not(:disabled) { cursor: pointer; text-decoration: underline dotted #0d6efd; }
        .clickable-sentence:not(:disabled):hover { background: #e7f1ff; }
        .clickable-sentence:disabled { opacity: 1; }
        .selected-sentence { outline: 2px solid #fd7e14; }
        .evidence-q1 { background: #e8f1ff; box-shadow: inset 0 -2px 0 #4f86d9; }
        .evidence-q2 { background: #f0ebff; box-shadow: inset 0 -2px 0 #8468d7; }
        .evidence-both {
            background: linear-gradient(90deg, #e8f1ff 50%, #f0ebff 50%);
            box-shadow: inset 0 -2px 0 #6f76d7;
        }
        .evidence-note {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #edf4fc;
            color: #425b78;
        }
        .study-stats { background: #f8f9fa; }
        .session-rank { background: #eef4ff; border-left: 4px solid #0d6efd; }
        .hero {
            text-align: center;
            overflow: visible;
            border: 0;
            background: transparent;
            box-shadow: none !important;
        }
        .hero-intro {
            min-height: calc(100vh - 112px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 70px 20px 110px;
            overflow: hidden;
            position: relative;
            border-radius: 30px;
            border: 2px solid #a9bfdc;
            color: #212529;
            background: #ffffff;
            box-shadow: 0 16px 38px rgba(69, 96, 132, 0.18);
        }
        .hero-intro::after {
            content: '';
            position: absolute;
            inset: 18px;
            pointer-events: none;
            border-radius: 22px;
            background: none;
        }
        .hero-intro > * { position: relative; z-index: 1; }
        .hero-intro .hero-title { color: #212529; text-shadow: none; }
        .hero-intro .lead { color: #6c757d !important; }
        .hero-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; }
        .hero-button { min-width: 220px; padding: 14px 24px; font-size: 1.1rem; }
        .landing-section {
            padding: 56px 20px;
        }
        .home-content {
            position: relative;
            margin: 48px -24px -24px;
            overflow: hidden;
            border-radius: 30px 30px 4px 4px;
            background: #ffffff;
            box-shadow: 0 22px 60px rgba(28, 52, 91, 0.14);
            text-align: center;
        }
        .home-content::before {
            content: '';
            display: block;
            width: 58px;
            height: 5px;
            margin: 18px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #0d6efd, #6f42c1);
            opacity: 0.72;
        }
        .home-content .landing-section:nth-of-type(even) {
            background: linear-gradient(135deg, #f7f9ff, #fffaf5);
        }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(42px) scale(0.985);
            transition: opacity 650ms ease, transform 650ms cubic-bezier(.2,.75,.25,1);
        }
        .scroll-reveal.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .landing-section h2 { font-weight: 750; margin-bottom: 20px; }
        .landing-copy { max-width: 680px; margin: 0 auto; line-height: 2; }
        .feature-card {
            height: 100%;
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid #dfe6ef;
            border-radius: 14px;
            text-align: left;
        }
        .feature-number { color: #0d6efd; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; }
        .play-step { text-align: left; padding: 18px; border-left: 3px solid #0d6efd; background: #fff; }
        .landing-footer { padding: 30px 20px 12px; color: #6c757d; }
        .home-menu {
            position: fixed;
            top: 32px;
            left: 32px;
            z-index: 30;
        }
        .menu-trigger {
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px solid #cbd9e9;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 5px 18px rgba(69, 96, 132, 0.14);
            cursor: pointer;
        }
        .menu-trigger span { width: 22px; height: 2px; border-radius: 2px; background: #24364d; }
        .menu-items {
            min-width: 180px;
            margin-top: 8px;
            padding: 8px;
            border: 1px solid #d5e1ef;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 12px 28px rgba(69, 96, 132, 0.18);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
        }
        .home-menu:hover .menu-items,
        .home-menu:focus-within .menu-items {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .menu-items button {
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #24364d;
            text-align: left;
        }
        .menu-items button:hover { background: #edf5ff; color: #0d6efd; }
        .home-progress {
            position: fixed;
            top: 32px;
            right: 32px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dee2e6;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: left;
        }
        .progress-ring {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: conic-gradient(#0d6efd calc(var(--rate) * 1%), #e5e9ef 0);
            position: relative;
        }
        .progress-ring::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: white;
        }
        .progress-ring span { position: relative; z-index: 1; font-weight: 700; }
        @media (max-width: 700px) {
            .home-progress {
                position: static;
                margin: 0 auto 32px;
                width: fit-content;
            }
        }
        .detail-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 30, 45, 0.62);
        }
        .detail-modal { width: min(760px, 100%); max-height: 88vh; overflow-y: auto; }
        .modal-close { font-size: 1.5rem; line-height: 1; border: 0; background: transparent; }
        .rank-celebration {
            width: min(560px, 100%);
            border: 1px solid #d9e4f2;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 22px 60px rgba(28, 52, 91, 0.24);
            animation: celebration-enter 360ms cubic-bezier(.2,.8,.2,1);
        }
        .rank-medal {
            width: 86px;
            height: 86px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fff4c7;
            color: #9a6b00;
            font-size: 2.3rem;
            box-shadow: inset 0 0 0 8px #fff9e4;
        }
        @keyframes celebration-enter {
            from { opacity: 0; transform: translateY(-34px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
<div id="app" class="container app-card">
    <div v-if="loading" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-box">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="loading-title mb-2">Loading...</p>
            <p class="text-muted mb-4">AIが問題を作成しています。</p>
            <button class="btn btn-outline-secondary" @click="cancelGeneration(false)">キャンセル</button>
        </div>

        <div class="mb-3">
            <button @click="execute" class="btn btn-primary">実行</button>
            <button @click="execute_kansai" class="btn btn-success ms-2">関西弁で実行</button>
        </div>
        
        <h3>結果:</h3>
        <div class="result-area p-3 border rounded" :class="{ 'alert alert-info': resultText && !resultText.startsWith('エラー:'), 'alert alert-danger': resultText.startsWith('エラー:') }">
            <pre style="white-space: pre-wrap;">{{ resultText }}</pre>
        </div>
    </div>

<script>
const { createApp } = Vue;

        createApp({
            data() {
                return {
                    inputText: '',
                    resultText: 'ここに結果が表示されます。'
                };
            },
            methods: {
                async sendRequest(context = null) {
                    this.resultText = '処理中...';
                    try {
                        const payload = { text: this.inputText };
                        if (context) {
                            payload.context = context;
                        }

                        const response = await fetch('/send_api', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json();
                        if (response.ok) {
                            this.resultText = data.processed_text;
                        } else {
                            this.resultText = `エラー: ${data.error || '不明なエラーが発生しました。'}`;
                        }
                    } catch (error) {
                        this.resultText = `エラー: ${error.message}`;
                    }
                },
                execute() {
                    this.sendRequest();
                },
                execute_kansai() {
                    this.sendRequest("あなたは親切な関西人です。ユーザーからの入力に対して、必ず関西弁で、親しみやすく、そして140字以内で回答してください。");
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
